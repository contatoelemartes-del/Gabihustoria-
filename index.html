<title>Gabrielle Salvatore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: uma coluna do tamanho de um celular. Cabeçalho, a aba aberta rolando no meio, e embaixo o campo de texto e as abas. */
:root{
  --bg:#f7f2ec; --surface:#fffcf8; --surface-2:#efe6dd; --line:#dccdc1;
  --fg:#2b2125; --muted:#6f5f63; --faint:#9a898d;
  --accent:#9b1d33; --accent-ink:#fff8f2; --accent-soft:#9b1d3316;
  --rose:#a3485a; --gold:#9c7529; --gold-soft:#9c752920;
  --bubble-me:#9b1d33; --bubble-me-ink:#fff8f2; --bubble-them:#ece2d8;
  --scrim:#1a121566; --shadow:0 12px 32px #2b212524;
  --f-display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130f11; --surface:#1b1619; --surface-2:#251d21; --line:#3a2d33;
    --fg:#ece2d7; --muted:#ab9b95; --faint:#76686c;
    --accent:#c0304a; --accent-ink:#fff6f0; --accent-soft:#c0304a24;
    --rose:#e09aa6; --gold:#d1ab5f; --gold-soft:#d1ab5f1f;
    --bubble-me:#8e1f33; --bubble-me-ink:#fff3ee; --bubble-them:#2a2126;
    --scrim:#000000a0; --shadow:0 12px 32px #00000070;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130f11; --surface:#1b1619; --surface-2:#251d21; --line:#3a2d33;
  --fg:#ece2d7; --muted:#ab9b95; --faint:#76686c;
  --accent:#c0304a; --accent-ink:#fff6f0; --accent-soft:#c0304a24;
  --rose:#e09aa6; --gold:#d1ab5f; --gold-soft:#d1ab5f1f;
  --bubble-me:#8e1f33; --bubble-me-ink:#fff3ee; --bubble-them:#2a2126;
  --scrim:#000000a0; --shadow:0 12px 32px #00000070;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.top{flex:none;display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--fg);position:relative;background:var(--bg);z-index:5}
.mono{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:21px;font-weight:600;flex:none}
.top h1{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.05;letter-spacing:.01em}
.top .sub{font-size:12.5px;color:var(--rose);letter-spacing:.02em}
.top .grow{flex:1;min-width:0}
.pill{font-size:11.5px;color:var(--rose);border:1px solid var(--fg);border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.err{color:var(--accent);border-color:var(--accent)}
.sub .st{display:none}
.sub .st.err{color:var(--accent)}
@media (max-width:480px){ .pill{display:none} .sub .st{display:inline} }
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.bell svg{width:18px;height:18px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.notifs{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30}
.notifs header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.notifs header button{background:none;border:0;color:var(--rose);font-size:12.5px}
.nrow{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-inline:0;border-top:0;align-items:flex-start}
.nrow.unread{background:var(--accent-soft)}
.nrow .nt{font-size:13.5px;line-height:1.35;min-width:0;flex:1;overflow-wrap:anywhere}
.nrow time{font-size:11.5px;color:var(--faint);white-space:nowrap}
.empty-n{padding:22px 14px;color:var(--muted);font-size:13.5px}

.banner{margin:14px 0 4px;border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--fg);background:var(--accent-soft)}

/* Vistas */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view-inner{padding-block:8px 28px}

/* História */
.msg{margin:22px 0}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.narr{border-left:2px solid var(--accent);padding-left:18px}
.narr .txt,.gabi .txt{font-family:var(--f-body);font-size:17px;line-height:1.72;color:var(--fg)}
.txt p{margin:0 0 .85em}
.txt p:last-child{margin-bottom:0}
.gabi{border-left:2px solid var(--gold);padding-left:18px}
.gabi .lbl{color:var(--gold)}
.gabi .txt{color:var(--muted);font-style:italic}
.sys{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:13px;color:var(--muted)}
.sys::before,.sys::after{content:"";height:1px;flex:1;background:var(--line)}
.sys button{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--fg);display:flex;gap:7px;align-items:center;font-size:12.5px;max-width:80%}
.sys button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sys svg{width:14px;height:14px;flex:none;color:var(--accent)}
.thinking{color:var(--faint);font-family:var(--f-body);font-style:italic;font-size:16px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.errbox{margin:18px 0;padding:12px 14px;border:1px dashed var(--accent);border-radius:12px;font-size:13.5px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Rodapé */
.foot{flex:none;background:var(--bg);border-top:1px solid var(--fg)}
.composer{padding-block:10px 4px}
.actions{display:flex;gap:16px;justify-content:flex-end;min-height:0}
.actions:empty{display:none}
.actions button{background:none;border:0;padding:2px 0 8px;font-size:12.5px;color:var(--rose);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.row{display:flex;gap:10px;align-items:flex-end}
.field{flex:1;min-width:0;border:1px solid var(--fg);border-radius:12px;background:var(--surface);padding:10px 14px;font-family:var(--f-body);font-size:16px;line-height:1.45;resize:none;max-height:40vh;min-height:46px;display:block;width:100%}
.field::placeholder{color:var(--faint)}
.send{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 6px;font-size:15px;flex:none}
.send:disabled{color:var(--faint);cursor:default}
.send.stop{color:var(--fg)}
.hint{font-size:11.5px;color:var(--rose);padding:4px 0 2px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--fg);padding-bottom:4px}
.tab{background:none;border:0;padding:10px 2px 9px;font-size:13px;color:var(--rose);position:relative;border-top:2px solid transparent;margin-top:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-top-color:var(--accent);font-weight:500}
.tab .dot{position:absolute;top:7px;left:calc(50% + 22px);width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* Botões */
.btn{border:1px solid var(--fg);background:transparent;border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 12px;font-size:12.5px}

/* Avatares */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:var(--surface-2);overflow:hidden;font-family:var(--f-ui);letter-spacing:.02em}
.av.fan{color:var(--muted);border:1px solid var(--line)}
.av.me{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:16px}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:84px;height:84px;font-size:30px;border:2px solid var(--gold)}

/* Insta */
.prof{display:flex;gap:18px;align-items:center;padding-top:18px}
.prof .stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.prof-name{margin-top:12px;font-weight:600}
.prof-bio{font-size:14px;color:var(--muted);white-space:pre-line}
.seg{display:flex;gap:6px;margin:16px 0 12px;align-items:center;flex-wrap:wrap}
.seg .grow{flex:1}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{aspect-ratio:1;max-width:100%;background:var(--surface-2);border:0;padding:0;position:relative;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cc{position:absolute;bottom:5px;right:6px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px #000a;font-weight:600}
.tile .an{position:absolute;inset:auto 0 0;padding:4px 6px;font-size:10.5px;color:#fff;background:#0008}
.newpost{border:1px solid var(--line);border-radius:14px;padding:14px;margin:6px 0 14px;display:grid;gap:10px;background:var(--surface)}
.newpost .pv{max-height:260px;width:100%;object-fit:cover;border-radius:8px;display:block}
.drop{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer}
.emptyst{padding:28px 6px;color:var(--muted);font-size:14px;text-align:center;font-family:var(--f-body);font-style:italic}
.card{border-bottom:1px solid var(--line);padding:14px 0 16px}
.card-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.card-h .who{font-weight:600;font-size:14px}
.card-h time,.meta{font-size:12px;color:var(--faint)}
.fakephoto{aspect-ratio:4/5;max-width:100%;border-radius:4px;display:flex;align-items:flex-end;padding:22px;color:#f7efe6;position:relative;overflow:hidden}
.fakephoto::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,#ffffff22,transparent 60%),linear-gradient(180deg,transparent 40%,#0000008c)}
.fakephoto p{position:relative;margin:0;font-family:var(--f-body);font-style:italic;font-size:16px;line-height:1.5;text-shadow:0 1px 3px #0008}
.fakephoto small{position:absolute;top:14px;left:16px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.realphoto{width:100%;max-width:100%;border-radius:4px;display:block;background:var(--surface-2)}
.likes{display:flex;gap:14px;align-items:center;margin:10px 0 6px;font-size:13.5px}
.heart{background:none;border:0;padding:0;display:flex;gap:6px;align-items:center;color:var(--fg)}
.heart svg{width:20px;height:20px}
.heart[aria-pressed="true"] svg{color:var(--accent);fill:var(--accent)}
.cap{font-size:14px;overflow-wrap:anywhere}
.cap b{margin-right:6px}
.cmt{font-size:14px;margin-top:6px;overflow-wrap:anywhere;display:flex;gap:8px;align-items:flex-start}
.cmt .c-body{flex:1;min-width:0}
.cmt b{margin-right:6px}
.cmt .c-meta{font-size:11.5px;color:var(--faint);display:flex;gap:12px;margin-top:1px}
.cmt .c-meta button{background:none;border:0;padding:0;color:var(--faint);font-size:11.5px;font-weight:600}
.more{background:none;border:0;padding:4px 0;color:var(--faint);font-size:13px}
.status{font-size:12.5px;color:var(--rose);font-style:italic;margin-top:6px}
.inline-reply{display:flex;gap:8px;margin-top:12px;align-items:center}
.inline-reply input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.inline-reply button{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}
.inline-reply button:disabled{color:var(--faint)}

/* Folha de post */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;justify-content:center;align-items:flex-end}
.sheet-in{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding-block:6px max(20px,env(safe-area-inset-bottom,0px))}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;padding-block:8px;position:sticky;top:0;background:var(--bg);z-index:2}
.x{background:none;border:0;font-size:14px;color:var(--rose);padding:6px 0}

/* Twitter */
.tw-compose{border-bottom:1px solid var(--line);padding:16px 0 14px;display:grid;gap:8px}
.tw-compose textarea{border:0;background:transparent;font-size:17px;resize:none;min-height:56px;width:100%;font-family:var(--f-ui);padding:0}
.tw-compose textarea:focus-visible{outline:none}
.tw-compose .row{justify-content:space-between;align-items:center}
.count{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tw{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tw .body{flex:1;min-width:0}
.tw .head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.tw .head b{font-weight:600}
.tw .head span{color:var(--faint);font-size:13px}
.tw .text{font-size:15px;margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.tw .bar{display:flex;gap:22px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tw .bar button{background:none;border:0;padding:0;color:inherit;display:flex;gap:6px;align-items:center}
.tw .bar svg{width:16px;height:16px}
.tw .bar [aria-pressed="true"]{color:var(--accent)}
.tw .bar [aria-pressed="true"] svg{fill:var(--accent)}
.replies{margin-top:10px;border-left:1px solid var(--line);padding-left:12px;display:grid;gap:10px}
.rep{display:flex;gap:8px;font-size:14px}
.rep .rb{min-width:0;flex:1;overflow-wrap:anywhere}
.rep .rh{font-size:13px}
.rep .rh span{color:var(--faint)}

/* DMs */
.dm-list{display:grid}
.dm-row{display:flex;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;align-items:center}
.dm-row .mid{flex:1;min-width:0}
.dm-row .mid b{display:block;font-weight:600;font-size:14.5px}
.dm-row .mid span{display:block;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-row.unread .mid span{color:var(--fg);font-weight:500}
.dm-row .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--faint)}
.udot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.people{display:flex;gap:12px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{background:none;border:0;display:grid;justify-items:center;gap:5px;font-size:11.5px;color:var(--muted);flex:none;width:58px}
.person .av{width:48px;height:48px;font-size:15px}
.sect{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin:18px 0 6px}
.thread{display:flex;flex-direction:column;height:100%}
.th-head{display:flex;gap:10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.th-head b{font-weight:600}
.th-head small{display:block;font-size:12px;color:var(--faint)}
.back{background:none;border:0;font-size:22px;line-height:1;padding:2px 6px 2px 0;color:var(--fg)}
.bubbles{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:4px}
.bub{max-width:78%;padding:8px 13px;border-radius:18px;font-size:15px;line-height:1.38;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--bubble-them);color:var(--fg);border-bottom-left-radius:6px}
.bub + .bub.gap{margin-top:10px}
.stamp{align-self:center;font-size:11px;color:var(--faint);margin:10px 0 4px}
.typing{align-self:flex-start;background:var(--bubble-them);border-radius:18px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.th-input{flex:none;padding-block:8px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.th-input textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:9px 15px;resize:none;font-size:15px;max-height:120px;min-height:40px}

/* Ficha */
.ficha h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:22px 0 2px;text-wrap:balance}
.ficha .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.f{display:grid;gap:5px;margin:14px 0}
.f label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.f textarea,.f input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-family:var(--f-body);font-size:15.5px;line-height:1.55;resize:vertical;width:100%}
.memory{border:1px solid var(--gold);background:var(--gold-soft);border-radius:12px;padding:14px;margin-top:8px}
.memory .f{margin:0 0 10px}
.memory .f label{color:var(--gold)}
.memrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.danger{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.danger p{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.confirm{border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:10px;display:grid;gap:10px;font-size:14px}
.confirm .row{flex-wrap:wrap}

/* Galerias */
.gal{display:grid;gap:14px;margin-top:8px}
.gal-row{border-bottom:1px solid var(--line);padding-bottom:12px}
.gal-h{display:flex;gap:10px;align-items:center}
.gal-h b{font-weight:600;font-size:14px}
.gal-h .grow{flex:1}
.gal-strip{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.gal-th{flex:none;width:68px;height:68px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--surface-2);position:relative}
.gal-th.sel{border-color:var(--accent)}
.gal-th img{width:100%;height:100%;object-fit:cover;display:block}

const $ = (s,r=document)=>r.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className = v;
    else if (k==="text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="style") el.style.cssText = v;
    else if (k==="html") el.innerHTML = v;
    else if (k==="value") el.value = v;
    else el.setAttribute(k, v===true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid==null || kid===false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
function svg(path, extra=""){ const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","1.7"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.innerHTML = path + extra; return s; }

function rel(t){

function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/^@/,"").trim(); }
function resolveWho(raw){
  const s = norm(raw);
  if (!s) return "fa:mysticfalls_local";
  if (s==="gabi" || s==="gabrielle" || s.startsWith("gabriellesalvatore")) return "gabi";
  for (const id of CHAR_IDS){
    const c = CHARS[id];
    if (s===id || s===norm(c.handle) || s===norm(c.short) || s===norm(c.name) || s.startsWith(id+" ") || s.includes(norm(c.handle))) return id;
  }
  if (s.startsWith("fa:") || s.startsWith("fa ")) return "fa:" + s.slice(3).replace(/^@/,"").replace(/[^a-z0-9_.]/g,"").slice(0,30) || "fa:mysticfalls_local";
  const first = s.split(/\s+/)[0];
  for (const id of CHAR_IDS) if (first===norm(CHARS[id].short)) return id;
  return "fa:" + s.replace(/[^a-z0-9_.]/g,"").slice(0,30);
}

function fmt(text){
  const frag = document.createDocumentFragment();
  String(text||"").split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(par=>{
    const p = document.createElement("p");
    par.split(/(\*[^*\n]+\*)/g).forEach(part=>{
      if (/^\*[^*\n]+\*$/.test(part)) p.append(h("em",null,part.slice(1,-1)));
      else if (part) p.append(part);
    });
    frag.append(p);
  });
  return frag;
}

const CHUNK = 40;
const coreRef = () => Cloud.db.doc(Cloud.base + "/core");
const storyCol = () => coreRef().collection("story");

const chunkId = i => "c" + String(i).padStart(4,"0");

function markDirty(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 1200); }
function persist(){

  saveLocal();
  if (Cloud) saveChain = saveChain.then(pushCloud).then(()=>setPill("cloud")).catch(e=>{ console.warn("save", e); setPill("err"); });
}
async function pushCloud(){
  const {story, ...core} = S;
  const chunks = [];
  for (let i=0; i<Math.max(1,Math.ceil(story.length/CHUNK)); i++) chunks.push(story.slice(i*CHUNK,(i+1)*CHUNK));
  for (let i=0;i<chunks.length;i++){
    const j = JSON.stringify(chunks[i]);
    if (lastChunkJSON[i] !== j){ await storyCol().doc(chunkId(i)).set({msgs:chunks[i]}); lastChunkJSON[i] = j; }
  }
  for (let i=chunks.length;i<lastChunkJSON.length;i++){ await storyCol().doc(chunkId(i)).delete(); }
  lastChunkJSON.length = chunks.length;
  let body = {data:core, chunks:chunks.length, savedAt:S.savedAt};
  if (JSON.stringify(body).length > 240000){
    S.tweets = S.tweets.slice(-60); S.insta.feed = S.insta.feed.slice(-20); S.notifs = S.notifs.slice(-30);
    for (const k of Object.keys(S.dms)) S.dms[k] = S.dms[k].slice(-60);
    const {story:_s, ...c2} = S; body = {data:c2, chunks:chunks.length, savedAt:S.savedAt};
  }
  await coreRef().set(body);
}
async function initCloud(){
  const C = window.claude;
  if (!C?.use) return;
  let db=null, user=null;
  try{ [db,user] = await Promise.all([C.use("db"), C.use("user")]); }catch{}

  let id = null; try{ id = await user.id(); }catch{}

  Cloud = {db, base:"data/users/"+id};
  try{

    if (snap.exists){
      const d = snap.data();
      if (!S.savedAt || (d.savedAt||0) > S.savedAt){
        const qs = await storyCol().get();
        const docs = qs.docs.filter(x=>x.exists).sort((a,b)=>a.id<b.id?-1:1);
        const story = docs.flatMap(x=>x.data().msgs||[]);
        S = {...d.data, story: story.length ? story : newGame().story};
        S.gallery ||= {};
        lastChunkJSON = docs.map(x=>JSON.stringify(x.data().msgs||[]));
        saveLocal();
        renderAll(true);
      } else if (d.savedAt === S.savedAt){
        const n = d.chunks||0;
        lastChunkJSON = Array.from({length:n},(_,i)=>JSON.stringify(S.story.slice(i*CHUNK,(i+1)*CHUNK)));
      } else {
        lastChunkJSON = Array.from({length:d.chunks||0},()=>"?");
        await pushCloud();
      }
    } else {
      await pushCloud();
    }

  }catch(e){ console.warn("cloud", e); Cloud = null; setPill("local"); }
}

function compressImage(file, max=760, q=0.8){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(blob=>{
        if (!blob) return rej(new Error("blob"));
        const fr = new FileReader(); fr.onload = ()=>res({blob, dataURL:fr.result}); fr.onerror = rej; fr.readAsDataURL(blob);
      }, "image/jpeg", q);
    };
    img.onerror = async ()=>{
      URL.revokeObjectURL(url);
      try{
        const bmp = await createImageBitmap(file);
        const sc = Math.min(1, max/Math.max(bmp.width,bmp.height));
        const c = document.createElement("canvas");
        c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
        c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
        c.toBlob(blob=>{ if (!blob) return rej(new Error("blob")); const fr = new FileReader(); fr.onload = ()=>res({blob, dataURL:fr.result}); fr.onerror = rej; fr.readAsDataURL(blob); }, "image/jpeg", q);
      }catch{ rej(new Error("img")); }
    };
    img.src = url;
  });
}

function applyQueued(q){
  if (q.type==="comment"){
    const p = findPost(q.postId); if (!p) return;
    p.comments.push({id:uid(), who:q.who, text:q.text, t:Date.now(), turn:q.turn});
    const mine = S.insta.posts.includes(p);
    if (mine || /@gabriellesalvatore/i.test(q.text)) addNotif({kind:"comment", who:q.who, tab:"insta", ref:p.id, text:`${hd(q.who)} ${mine?"comentou sua foto":"te respondeu"}: ${q.text}`, turn:q.turn});
  } else if (q.type==="likes"){
    const p = q.tweet ? findTweet(q.postId) : findPost(q.postId); if (!p) return;
    p.likes = (p.likes||0) + q.n; if (q.rts) p.rts = (p.rts||0) + q.rts;
  } else if (q.type==="follow"){
    S.insta.followers += q.n;
    addNotif({kind:"follow", who:"fa:novos", tab:"insta", text:`+${nf(q.n)} novos seguidores no Insta`});
  } else if (q.type==="dm"){
    addDM(q.who, q.text, {turn:q.turn});
  } else if (q.type==="tweetReply"){
    const t = findTweet(q.tweetId); if (!t) return;
    t.replies.push({id:uid(), who:q.who, text:q.text, t:Date.now(), turn:q.turn});
    if (t.who==="gabi" || /@gabriellesalvatore/i.test(q.text)) addNotif({kind:"reply", who:q.who, tab:"twitter", ref:t.id, text:`@${hd(q.who)} respondeu: ${q.text}`, turn:q.turn});
  }
}
function tick(){
  const now = Date.now(); let changed = false;
  const due = S.queue.filter(q=>q.at<=now);
  if (due.length){
    S.queue = S.queue.filter(q=>q.at>now);
    due.sort((a,b)=>a.at-b.at).forEach(q=>{ try{ applyQueued(q); }catch(e){ console.warn(e); } });
    changed = true;
  }
  if (changed){ markDirty(); renderAll(); }
  else if (UI.tab==="dms" && CHARS[UI.thread] && threadTyping(UI.thread) !== UI.lastTyping) renderDMs();
}

function narratorPrompt(){

${S.rules}

- Português do Brasil, com a qualidade de um episódio de TVD: concreto, sensorial, com subtexto e tensão. Diálogos com travessão (—).
- Cada personagem com a voz da série: Damon ácido e engraçado na pior hora; Stefan contido e perceptivo; Klaus elegante, perigosamente calmo, possessivo com ela; Elena calorosa e firme; Caroline acelerada; Bonnie desconfiada; Katherine venenosa e divertida.
- 3 a 6 parágrafos curtos (mais ou menos 150 a 350 palavras). Termine num ponto em que a Gabrielle possa reagir: uma fala, um gesto ou um silêncio dirigido a ela.
- NUNCA escreva o que a Gabrielle diz, faz, pensa, sente ou decide, nem reações do corpo dela. Você pode descrever o que os outros fazem com ela e o que o mundo mostra a ela.
- Se o turno da Gabi for curto ou ambíguo, siga a intenção mais natural sem inventar ações da Gabrielle.
- Ritmo devagar. Um mistério por vez. Não resolva tudo nem empilhe reviravoltas.
- Sem títulos, sem listas de opções, sem perguntas do tipo "o que você faz?", sem comentários fora da história.

AS REDES SOCIAIS FAZEM PARTE DA HISTÓRIA:
- Você recebe o estado do Instagram, do Twitter e das DMs, e as notificações que a Gabrielle ainda não viu.
- Personagens na cena podem comentar posts e tweets PÚBLICOS que viram. DMs são privadas: só a Gabrielle e quem mandou conhecem o conteúdo.
- Se houver notificação não vista, você pode mostrar o celular vibrando ou a tela acendendo, sem revelar o conteúdo. Se a Gabi disser que a Gabrielle olha o celular, use o conteúdo real das notificações.
- Raramente, e só quando tiver peso dramático, um personagem que NÃO está na cena pode mandar uma DM ou tuitar. Para isso, acrescente no final, em linha separada, exatamente um destes formatos:
@@DM|id do personagem|texto da mensagem
@@TWEET|id do personagem|texto do tweet
Ids: ${CHAR_IDS.join(", ")}. Essas linhas não aparecem como texto; viram notificações reais. Se usar, mostre na narração só o celular vibrando.

FICHA DA GABRIELLE:
${fichaText()}

MEMÓRIA DO MUNDO (resumo do que já aconteceu):
${S.memory}

A seguir, as últimas mensagens da história.`;

function buildNarratorInput(turn){
  const gabiMsg = S.story.find(m=>m.role==="gabi" && m.turn===turn);

  const msgs = [{role:"user", content:narratorPrompt()}];
  hist.forEach(m=>msgs.push({role: m.role==="gabi" ? "user" : "assistant", content:m.text}));
  msgs.push({role:"user", content:`[ESTADO DAS REDES AGORA]\n${socialContext()}\n\n[TURNO DA GABI, narrando a Gabrielle]\n${gabiMsg.text}\n\n[Escreva a próxima resposta do narrador.]`});
  return msgs;
}
function visibleNarr(text){ return text.replace(/(^|\n)@@[\s\S]*$/,"").trim(); }
let narrCtl = null;
async function runNarrator(turn){
  UI.storyErr = null;
  UI.streaming = {turn, text:""};
  renderStory(true); renderComposer();
  narrCtl = new AbortController();
  try{
    const ai = await needAI();

      modelTier:"complex", cache:false, signal:narrCtl.signal,
      onText:({text})=>{ if (UI.streaming){ UI.streaming.text = text; updateStream(); } },
    });
    if (S.turn < turn || !S.story.some(m=>m.turn===turn && m.role==="gabi")){ UI.streaming = null; renderStory(); return; }
    const raw = r.text;
    const clean = visibleNarr(raw);
    S.story.push({id:uid(), role:"narr", text:clean || "…", turn, t:Date.now()});
    UI.streaming = null;
    handleTags(raw, turn);
    const g = S.story.find(m=>m.role==="gabi" && m.turn===turn);
    if (g && /celular|telefone|mensage|notifica|\bdm\b|tela|insta|twitter/i.test(g.text)) S.notifs.forEach(n=>n.read = true);
    markDirty(); renderAll(true);
    afterTurn(turn);
  }catch(e){
    UI.streaming = null;
    if (e?.code !== "cancelled") UI.storyErr = {turn, msg:errMsg(e)};
    else UI.storyErr = {turn, msg:"Resposta interrompida."};
    renderStory(true); renderComposer();
  }finally{ narrCtl = null; renderComposer(); }
}
function handleTags(raw, turn){
  const lines = raw.split("\n").filter(l=>l.trim().startsWith("@@"));
  for (const line of lines.slice(0,2)){
    const parts = line.trim().slice(2).split("|");
    const kind = (parts[0]||"").toUpperCase().trim();
    const w = resolveWho(parts[1]); const text = parts.slice(2).join("|").trim();
    if (!text || !CHARS[w]) continue;
    if (kind==="DM") scheduleStoryEvent({tipo:"dm", quem:w, texto:text}, turn, 4000);
    else if (kind==="TWEET") scheduleStoryEvent({tipo:"tweet", quem:w, texto:text}, turn, 4000);
    S.lastEventTurn = turn;
  }
}
function scheduleStoryEvent(ev, turn, delay=0){
  const w = resolveWho(ev.quem); if (!CHARS[w]) return;
  const apply = ()=>{
    if (S.turn < turn) return;
    if (ev.tipo==="dm"){
      const text = String(ev.texto||"").trim(); if (!text) return;
      addDM(w, text, {turn});
      S.story.push({id:uid(), role:"sys", kind:"dm", who:w, text:`Nova DM de ${nm(w)}`, turn, t:Date.now()});
    } else if (ev.tipo==="tweet"){
      const text = String(ev.texto||"").trim(); if (!text) return;
      const tw = {id:uid(), who:w, text, t:Date.now(), likes:clampN(Math.random()*20,0,40,3), rts:0, replies:[], turn};
      S.tweets.push(tw);
      addNotif({kind:"tweet", who:w, tab:"twitter", ref:tw.id, text:`@${hd(w)} tuitou: ${text}`, turn});
      S.story.push({id:uid(), role:"sys", kind:"tweet", who:w, ref:tw.id, text:`${nm(w)} tuitou`, turn, t:Date.now()});
    } else if (ev.tipo==="insta"){
      const g = pickPhoto(w, ev.foto);
      const p = {id:uid(), who:w, photo:g?.id||null, desc:String(ev.descricao||g?.desc||"").trim(), caption:String(ev.legenda||"").trim(), likes:clampN(ev.curtidas,3,5000,40), t:Date.now(), comments:[], turn};
      if (!p.desc && !p.caption) return;
      (ev.comentarios||[]).slice(0,4).forEach((c,i)=>{ const t = String(c.texto||"").trim(); if (t) p.comments.push({id:uid(), who:resolveWho(c.quem), text:t, t:Date.now()+i, turn}); });
      S.insta.feed.push(p);
      addNotif({kind:"insta", who:w, tab:"insta", ref:p.id, text:`${nm(w)} postou uma foto: ${p.caption}`, turn});
      S.story.push({id:uid(), role:"sys", kind:"insta", who:w, ref:p.id, text:`${nm(w)} postou no Insta`, turn, t:Date.now()});
    }
    markDirty(); renderAll(true);
  };
  if (delay) setTimeout(apply, delay); else apply();
}

function galleryText(){

  }

function pickPhoto(w, raw){
  const ph = S.gallery?.[w]?.photos || []; if (!ph.length || raw==null) return null;
  const want = String(raw).replace(/[\[\]]/g,"").trim();
  if (!want || want==="null") return null;
  const hit = ph.find(x=>x.id===want); if (hit) return hit;
  const used = usedPhotos(); const free = ph.filter(x=>!used.has(x.id)); const pool = free.length ? free : ph;
  return pool[Math.floor(Math.random()*pool.length)];
}
function dataURLtoBlob(d){
  const [head, b64] = d.split(","); const mime = (head.match(/data:([^;]+)/)||[])[1] || "image/jpeg";
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

    h("h2",null,"Memória do mundo"),
    h("p",{class:"lead"},"Um resumo do que já aconteceu. Ele se atualiza sozinho a cada 5 turnos, e você pode corrigir à mão."),
    h("div",{class:"memory"},
      h("div",{class:"f"}, h("label",{for:"f-memory"},`Turno ${S.turn} · atualizada no turno ${S.memoryTurn||0}`), h("textarea",{id:"f-memory",rows:"9",value:S.memory,oninput:(e)=>{ S.memory=e.target.value; fitTA(e.target); markDirty(); }})),
      h("div",{class:"memrow"}, h("span",null, since>=5 ? "Atualiza depois da próxima resposta." : `Próxima atualização em ${5-since} ${5-since===1?"turno":"turnos"}.`),
        h("button",{class:"btn sm",disabled:UI.memBusy,onclick:()=>updateMemory(true)}, UI.memBusy ? "Atualizando…" : "Atualizar agora"))),
    h("div",{class:"danger"},
      h("p",null,"Recomeçar apaga a história, os posts, os tweets e as DMs, e volta para o prólogo. A ficha e as regras ficam."),
      UI.confirmReset
        ? h("div",{class:"confirm"}, h("div",null,"Apagar tudo e voltar ao prólogo? Não dá para desfazer."),
            h("div",{class:"row"}, h("button",{class:"btn primary",onclick:resetGame},"Apagar e recomeçar"), h("button",{class:"btn ghost",onclick:()=>{ UI.confirmReset=false; renderFicha(); }},"Cancelar")))
        : h("button",{class:"btn ghost",onclick:()=>{ UI.confirmReset=true; renderFicha(); }},"Recomeçar do zero"))
  );
  root.querySelectorAll("textarea").forEach(fitTA);
  $("#v-ficha").scrollTop = fichaScroll;
  if (focusedId){ const el = document.getElementById(focusedId); el?.focus(); }
}
function fitTA(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
function resetGame(){
  narrCtl?.abort();
  S.insta.posts.forEach(p=>dropPhoto(p.photo));
  S = newGame({ficha:S.ficha, rules:S.rules, insta:S.insta, gallery:S.gallery});
  UI.confirmReset = false; UI.streaming = null; UI.storyErr = null; UI.thread = null; UI.sheet = null;
  persist();
  setTab("historia");
  toast({text:"História recomeçada do prólogo."});
}

/* Toast */
let toastTimer = null;
function toast(n){
  const root = $("#toastRoot");
  const el = h(n.tab ? "button" : "div",{class:"toast",role:"status",onclick: n.tab ? ()=>{ root.replaceChildren(); openNotif(n); } : null},
    n.who ? avatar(n.who,"sm") : null, h("span",{class:"nt"}, n.text));
  root.replaceChildren(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>root.replaceChildren(), 4500);
}

/* ============================================================
   Eventos
   ============================================================ */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
$("#bellBtn").addEventListener("click",(e)=>{ e.stopPropagation(); UI.notifOpen = !UI.notifOpen; renderHeader(); });
document.addEventListener("click",(e)=>{ if (UI.notifOpen && !e.target.closest("#notifPanel") && !e.target.closest("#bellBtn")){ UI.notifOpen=false; renderHeader(); } });
document.addEventListener("keydown",(e)=>{ if (e.key==="Escape"){ if (UI.sheet) closeSheet(); if (UI.notifOpen){ UI.notifOpen=false; renderHeader(); } } });
const storyInput = $("#storyInput");
storyInput.addEventListener("input",()=>{ autosize(storyInput); renderComposer(); try{ sessionStorage.setItem("gs:draft", storyInput.value); }catch{} });
storyInput.addEventListener("keydown",(e)=>{ if (e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendStory(); } });
$("#sendBtn").addEventListener("click",()=>{ if (UI.streaming) narrCtl?.abort(); else sendStory(); });
$("#avatarFile").addEventListener("change", async (e)=>{
  const f = e.target.files?.[0]; if (!f) return;
  UI.avatarBusy = true; renderInsta();
  try{
    const img = await compressImage(f, 320, 0.85);
    const id = "avatar-"+uid(); const old = S.insta.avatar;
    storePhoto(id, img.dataURL);
    S.insta.avatar = id; if (old) dropPhoto(old);
    markDirty(); toast({text:"Foto de perfil trocada."});
  }catch{ toast({text:badImageMsg(f)}); }
  finally{ e.target.value = ""; UI.avatarBusy = false; renderAll(); }
});
$("#npFile").addEventListener("change",(e)=>{
  const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
  const np = (UI.newPost ||= {});
  np.file = f; if (np.url) URL.revokeObjectURL(np.url); np.url = URL.createObjectURL(f);
  UI.instaSeg = "perfil"; renderInsta();
});
$("#galFile").addEventListener("change",(e)=>{ const files = Array.from(e.target.files||[]); e.target.value = ""; if (UI.galTarget && files.length) addGallery(UI.galTarget, files); });
document.addEventListener("visibilitychange",()=>{ if (document.hidden) persist(); });
window.addEventListener("pagehide", persist);

/* Início */
try{ const d = sessionStorage.getItem("gs:draft"); if (d) storyInput.value = d; }catch{}
let startTab = "historia"; try{ startTab = sessionStorage.getItem("gs:tab") || "historia"; }catch{}
setTab(["historia","insta","twitter","dms","ficha"].includes(startTab) ? startTab : "historia");
autosize(storyInput);
setInterval(tick, 1500);
initCloud();
</script>
